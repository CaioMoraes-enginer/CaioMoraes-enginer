<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 310" role="img" aria-label="Pixel-art mission control dashboard"><style>text{font-family:monospace}.s{animation:blink 1s steps(1,end) infinite}.bar{transform-origin:left;animation:load 3.6s steps(10,end) infinite}.pulse{animation:pulse 1.2s steps(2,end) infinite}.scan{animation:scan 2.6s linear infinite}@keyframes blink{50%{opacity:0}}@keyframes load{0%,15%{transform:scaleX(.18)}70%,100%{transform:scaleX(1)}}@keyframes pulse{50%{opacity:.25}}@keyframes scan{from{transform:translateX(-360px)}to{transform:translateX(1320px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1280" height="310" rx="12" fill="#10070b"/><rect x="20" y="20" width="1240" height="270" rx="7" fill="#190a10" stroke="#b3192b" stroke-width="3"/><path d="M20 62h1240M20 247h1240" stroke="#5a1420" stroke-width="3"/><text x="44" y="48" fill="#ffc9a3" font-size="20" font-weight="700">CAIO_OS / MISSION CONTROL</text><text x="1094" y="48" fill="#ff5a5f" font-size="17">LIVE <tspan class="s">■</tspan></text><g transform="translate(44 90)"><rect width="360" height="130" rx="5" fill="#260c16" stroke="#7a1824"/><text x="20" y="32" fill="#ffc9a3" font-size="18">01  LOMIENS</text><text x="20" y="61" fill="#ff9a93" font-size="14">hospitality ops platform</text><rect x="20" y="85" width="320" height="14" fill="#4a111c"/><rect class="bar" x="20" y="85" width="320" height="14" fill="#e53b45"/><text x="20" y="121" fill="#ffcbc3" font-size="13">SYSTEMS: ONLINE</text><circle class="pulse" cx="325" cy="116" r="7" fill="#65d46e"/><rect x="395" width="360" height="130" rx="5" fill="#260c16" stroke="#7a1824"/><text x="415" y="32" fill="#ffc9a3" font-size="18">02  AI AUTOMATION</text><text x="415" y="61" fill="#ff9a93" font-size="14">RAG • agents • production APIs</text><rect x="415" y="85" width="320" height="14" fill="#4a111c"/><rect class="bar" x="415" y="85" width="320" height="14" fill="#ff6a5f" style="animation-delay:.45s