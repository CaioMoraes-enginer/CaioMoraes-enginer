<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 210" role="img" aria-label="Animated skill arcade meter"><style>text{font-family:monospace}.a{transform-origin:left;animation:fill 3s steps(8,end) infinite alternate}@keyframes fill{from{transform:scaleX(.3)}to{transform:scaleX(1)}}.p{animation:p 1s steps(1,end) infinite}@keyframes p{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1280" height="210" rx="12" fill="#10070b"/><text x="40" y="39" fill="#ffc9a3" font-size="19" font-weight="700">SKILL ARCADE / HIGH SCORE BOARD</text><g font-size="15"><text x="42" y="84" fill="#ffaaa0">PYTHON + DATA</text><text x="42" y="124" fill="#ffaaa0">BACKEND SYSTEMS</text><text x="42" y="164" fill="#ffaaa0">ML + AGENTIC AI</text></g><g><rect x="260" y="68" width="860" height="19" fill="#3a0e18"/><rect class="a" x="260" y="68" width="820" height="19" fill="#b3192b"/><rect x="260" y="108" width="860" height="19" fill="#3a0e18"/><rect class="a" x="260" y="108" width="760" height="19" fill="#e33d48" style="animation-delay:.4s"/><rect x="260" y="148" width="860" height="19" fill="#3a0e18"/><rect class="a" x="260" y="148" width="795" height="19" fill="#ff6a5f" style="animation-delay:.8s"/></g><g class="p" fill="#ffcabf"><text x="1140" y="84" font-size="14">READY</text><text x="1140" y="124" font-size="14">READY</text><text x="1140" y="164" font-size="14">READY</text></g></svg>
